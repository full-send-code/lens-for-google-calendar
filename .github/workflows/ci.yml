name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: TypeScript check
      run: npx tsc --noEmit
      
    - name: Run tests
      run: npm test
      
    - name: Security audit
      run: npm audit --audit-level high
      continue-on-error: true
      
    - name: Build extension
      run: npm run build
      
    - name: Validate build
      run: |
        # Check required files
        test -f dist/manifest.json || (echo "❌ manifest.json missing" && exit 1)
        
        # Check for background script (Vite generates with hash)
        if ls dist/assets/background*.js 1> /dev/null 2>&1; then
          echo "✅ Background script found: $(ls dist/assets/background*.js)"
        else
          echo "❌ Background script missing"
          exit 1
        fi
        
        # Validate manifest
        node -e 'const manifest = require("./dist/manifest.json"); if (manifest.manifest_version !== 3) throw new Error("Must be Manifest V3"); if (!manifest.name || !manifest.version) throw new Error("Missing name/version"); console.log("✅ Build valid:", manifest.name, "v" + manifest.version);'
        
        # Check size
        SIZE=$(du -sm dist/ | cut -f1)
        echo "📦 Extension size: ${SIZE}MB"
        [ $SIZE -gt 10 ] && echo "⚠️ Large build size" || echo "✅ Reasonable size"
    
    - name: Create release ZIP
      if: matrix.node-version == '20.x'
      shell: pwsh
      run: |
        # Make release script executable and run it
        .\release.ps1
        
        # Verify the zip was created
        $zipFiles = Get-ChildItem -Path "dist" -Filter "lens-for-google-calendar-v*.zip"
        if ($zipFiles.Count -eq 0) {
          Write-Error "❌ No release ZIP found in dist/"
          exit 1
        }
        
        $releaseFile = $zipFiles[0]
        $size = $releaseFile.Length / 1MB
        Write-Host "📦 Created: $($releaseFile.Name)"
        Write-Host "📊 Release size: $([math]::Round($size, 2))MB"
        
    - name: Upload release
      if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: "dist/lens-for-google-calendar-v*.zip"
        retention-days: 90
    
    - name: Extract version
      if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
      id: version
      run: |
        VERSION=$(node -e "console.log(require('./manifest.json').version)")
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' && matrix.node-version == '20.x'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/lens-for-google-calendar-v*.zip
        tag_name: v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}